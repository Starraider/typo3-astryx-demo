<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:vite="http://typo3.org/ns/Praetorius/ViteAssetCollector/ViewHelpers"
    xmlns:stylex="http://typo3.org/ns/Vendor/StylexConnector/ViewHelpers"
>
<vite:asset entry="EXT:astryx_sitepackage/Resources/Private/JavaScript/Main.entry.js" />
<div class="site-wrapper site-wrapper--{page.pageLayout.identifier} {stylex:class(styles: 'Site.wrapper')}">
    <f:render partial="Header" arguments="{_all}"/>
    <main id="main-content" role="main" class="site-main {stylex:class(styles: 'Site.shell')}">
        <div class="{stylex:class(styles: 'Site.content')}">
            <f:render section="Main"/>
        </div>
    </main>
    <f:render partial="Footer" arguments="{_all}"/>
</div>
</html>
