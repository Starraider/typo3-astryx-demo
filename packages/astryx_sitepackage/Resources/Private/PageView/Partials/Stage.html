<f:if condition="{content.stage.records}">
    <div class="stage-banner__container container {stylex:class(styles: 'Site.container, Site.stageBanner')}">
        <f:for each="{content.stage.records}" as="record">
            <f:cObject
                typoscriptObjectPath="{record.mainType}"
                data="{record}"
                table="{record.mainType}"
            />
        </f:for>
    </div>
</f:if>
