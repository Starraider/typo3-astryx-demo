<ul class="site-nav__list {stylex:class(styles: 'Site.navList')}">
    <f:for each="{menu}" as="menuItem">
        <li class="site-nav__item{f:if(condition: menuItem.active, then: ' site-nav__item--active')}{f:if(condition: menuItem.current, then: ' site-nav__item--current')} {stylex:class(styles: 'Site.navItem')}">
            <f:variable name="isActive" value="{menuItem.active}" />
            <a href="{menuItem.link}" target="{menuItem.target}" title="{menuItem.title}"
               class="site-nav__link{f:if(condition: menuItem.active, then: ' site-nav__link--active')} {stylex:class(styles: 'Site.navLink', when: {isActive: 'Site.navLinkActive'})}"
               aria-current="{f:if(condition: menuItem.current, then: 'page', else: 'false')}">
                {menuItem.title}
            </a>
        </li>
    </f:for>
</ul>
