imports:
  - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Processing.yaml' }
  - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Editor/Base.yaml' }
  - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Editor/Plugins.yaml' }
editor:
  config:
    contentsCss:
      - 'EXT:typo3_astryx/Resources/Public/Css/rte-tokens.css'
    toolbar:
      items:
        - style
        - heading
        - '|'
        - bold
        - italic
        - subscript
        - superscript
        - softhyphen
        - '|'
        - bulletedList
        - numberedList
        - blockQuote
        - alignment
        - '|'
        - findAndReplace
        - link
        - '|'
        - removeFormat
        - undo
        - redo
        - '|'
        - insertTable
        - '|'
        - specialCharacters
        - horizontalLine
        - sourceEditing
    # YAML imports append lists, so define heading models only in this preset.
    heading:
      options:
        - { model: paragraph, title: Paragraph, class: ck-heading_paragraph }
        - { model: heading2, view: h2, title: 'Heading 2', class: ck-heading_heading2 }
        - { model: heading3, view: h3, title: 'Heading 3', class: ck-heading_heading3 }
        - { model: heading4, view: h4, title: 'Heading 4', class: ck-heading_heading4 }
    style:
      definitions:
        - { name: 'Lead', element: p, classes: [lead] }
        - { name: 'Small', element: small }
        - { name: 'Muted', element: span, classes: [text-muted] }
    alignment:
      options:
        - { name: left, className: text-start }
        - { name: center, className: text-center }
        - { name: right, className: text-end }
        - { name: justify, className: text-justify }
    table:
      defaultHeadings: { rows: 1 }
      contentToolbar:
        - tableColumn
        - tableRow
        - mergeTableCells
        - tableProperties
        - tableCellProperties
        - toggleTableCaption
processing:
  allowTags: 'p,h2,h3,h4,h5,h6,strong,em,a,ul,ol,li,blockquote,pre,code,table,thead,tbody,tr,th,td,caption,br,hr'
