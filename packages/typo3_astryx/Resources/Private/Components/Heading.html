<f:argument name="text" type="string" default="" />
<f:argument name="level" type="int" default="2" />
<f:argument name="size" type="string" default="medium" />
<f:argument name="align" type="string" default="start" />
<f:argument name="subtitle" type="string" default="" />
<f:argument name="link" type="string|TYPO3\CMS\Core\LinkHandling\TypolinkParameter" default="" />
<f:variable name="headingSlot" value="{f:slot()}" />
<f:if condition="{text -> f:format.trim()} !== '' || {headingSlot -> f:format.trim()} !== ''">
    <f:switch expression="{level}">
        <f:case value="1"><h1 class="astryx-heading {ax:recipe(name: 'Heading', options: {size: size, align: align})}"><f:link.typolink parameter="{link}">{text}{headingSlot -> f:format.raw()}</f:link.typolink></h1></f:case>
        <f:case value="2"><h2 class="astryx-heading {ax:recipe(name: 'Heading', options: {size: size, align: align})}"><f:link.typolink parameter="{link}">{text}{headingSlot -> f:format.raw()}</f:link.typolink></h2></f:case>
        <f:case value="3"><h3 class="astryx-heading {ax:recipe(name: 'Heading', options: {size: size, align: align})}"><f:link.typolink parameter="{link}">{text}{headingSlot -> f:format.raw()}</f:link.typolink></h3></f:case>
        <f:case value="4"><h4 class="astryx-heading {ax:recipe(name: 'Heading', options: {size: size, align: align})}"><f:link.typolink parameter="{link}">{text}{headingSlot -> f:format.raw()}</f:link.typolink></h4></f:case>
        <f:case value="5"><h5 class="astryx-heading {ax:recipe(name: 'Heading', options: {size: size, align: align})}"><f:link.typolink parameter="{link}">{text}{headingSlot -> f:format.raw()}</f:link.typolink></h5></f:case>
        <f:case value="6"><h6 class="astryx-heading {ax:recipe(name: 'Heading', options: {size: size, align: align})}"><f:link.typolink parameter="{link}">{text}{headingSlot -> f:format.raw()}</f:link.typolink></h6></f:case>
        <f:defaultCase><h2 class="astryx-heading {ax:recipe(name: 'Heading', options: {size: size, align: align})}"><f:link.typolink parameter="{link}">{text}{headingSlot -> f:format.raw()}</f:link.typolink></h2></f:defaultCase>
    </f:switch>
</f:if>
<f:if condition="{subtitle}"><p class="astryx-lead" data-heading-align="{align}">{subtitle}</p></f:if>
