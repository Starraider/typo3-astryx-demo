<f:if condition="{ax:fileAvailable(file: file)}"><f:if condition="{file.type} == 2"><f:then><f:render partial="Media/Image" arguments="{file: file, aspectRatio: aspectRatio, sizes: sizes, eager: eager}" /></f:then><f:else><figure class="astryx-media"><f:variable name="posterUrl" value="" /><f:if condition="{poster}"><f:variable name="posterUrl" value="{f:uri.image(image: poster, width: '960')}" /></f:if><f:media file="{file}" width="960" additionalConfig="{autoplay: 0, controls: 1, preload: 'metadata', poster: posterUrl}" /><f:if condition="{file.description}"><figcaption>{file.description}</figcaption></f:if></figure></f:else></f:if></f:if>
