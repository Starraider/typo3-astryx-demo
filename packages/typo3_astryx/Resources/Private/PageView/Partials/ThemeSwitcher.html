<button type="button" class="astryx-theme-switcher" data-astryx-mode-toggle
    aria-label="{f:translate(key: 'switchToDark', extensionName: 'Typo3Astryx', default: 'Switch to dark mode')}"
    data-label-dark="{f:translate(key: 'switchToDark', extensionName: 'Typo3Astryx', default: 'Switch to dark mode')}"
    data-label-light="{f:translate(key: 'switchToLight', extensionName: 'Typo3Astryx', default: 'Switch to light mode')}"
    hidden>
    <f:image src="EXT:typo3_astryx/Resources/Public/Icons/moon.svg" class="astryx-theme-icon" width="20" height="20" alt="" additionalAttributes="{'data-theme-icon': 'dark', 'aria-hidden': 'true'}" />
    <f:image src="EXT:typo3_astryx/Resources/Public/Icons/sun.svg" class="astryx-theme-icon" width="20" height="20" alt="" additionalAttributes="{'data-theme-icon': 'light', 'aria-hidden': 'true', hidden: 'hidden'}" />
</button>
