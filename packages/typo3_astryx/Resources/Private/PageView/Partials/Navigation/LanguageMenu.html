<f:variable name="occurrence" value="{ax:occurrence(prefix: 'language')}" />
<nav class="astryx-language-menu {ax:recipe(name: 'Navigation', options: {part: 'language-menu'})}" aria-label="{f:translate(key: 'language', extensionName: 'Typo3Astryx', default: 'Language')}">
    <details class="astryx-dropdown {ax:recipe(name: 'Navigation', options: {part: 'disclosure'})}" data-astryx-dropdown>
        <summary class="astryx-menu-link astryx-language-toggle {ax:recipe(name: 'Navigation', options: {part: 'summary'})} {ax:recipe(name: 'Navigation', options: {part: 'link'})} {ax:recipe(name: 'Navigation', options: {part: 'language-toggle'})}" aria-controls="{occurrence.namespace}-options" aria-label="{f:translate(key: 'language', extensionName: 'Typo3Astryx', default: 'Language')}">
            <f:for each="{items}" as="language">
                <f:if condition="{language.active}">
                    <f:render partial="Navigation/LanguageFlag" arguments="{language: language}" />
                    <span lang="{language.hreflang}">{language.twoLetterIsoCode -> f:format.case(mode: 'upper')}</span>
                </f:if>
            </f:for>
            <span class="astryx-chevron {ax:recipe(name: 'Navigation', options: {part: 'chevron'})}" aria-hidden="true"></span>
        </summary>
        <ul class="astryx-dropdown-panel astryx-language-options {ax:recipe(name: 'Navigation', options: {part: 'dropdown-panel'})} {ax:recipe(name: 'Navigation', options: {part: 'language-panel'})}" id="{occurrence.namespace}-options">
            <f:for each="{items}" as="language">
                <li class="{ax:recipe(name: 'Navigation', options: {part: 'row'})}">
                    <f:if condition="{language.available}">
                        <f:then>
                            <f:variable name="current" value="{f:if(condition: language.active, then: 'true', else: 'false')}" />
                            <f:link.typolink parameter="{language.link}" class="{ax:recipe(name: 'Navigation', options: {part: 'link'})} {ax:recipe(name: 'Navigation', options: {part: 'language-option'})}" additionalAttributes="{hreflang: language.hreflang, lang: language.hreflang, 'aria-current': current}">
                                <f:render partial="Navigation/LanguageFlag" arguments="{language: language}" />
                                {language.navigationTitle}
                            </f:link.typolink>
                        </f:then>
                        <f:else>
                            <span class="{ax:recipe(name: 'Navigation', options: {part: 'link'})} {ax:recipe(name: 'Navigation', options: {part: 'language-option'})}" aria-disabled="true" lang="{language.hreflang}">
                                <f:render partial="Navigation/LanguageFlag" arguments="{language: language}" />
                                {language.navigationTitle}
                            </span>
                        </f:else>
                    </f:if>
                </li>
            </f:for>
        </ul>
    </details>
</nav>
