<f:if condition="{settings.Astryx.useVite}"><f:then><vite:asset entry="EXT:typo3_astryx/Resources/Private/JavaScript/frontend.entry.js" /></f:then><f:else><f:asset.css identifier="astryx" href="EXT:typo3_astryx/Resources/Public/Assets/astryx.css" /><f:asset.script identifier="astryx" src="EXT:typo3_astryx/Resources/Public/Assets/astryx.js" type="module" /></f:else></f:if>
<f:render partial="ProductAssets" optional="{true}" arguments="{_all}" />
<div class="astryx-root astryx-shell {ax:recipe(name: 'PageShell', options: {part: 'root'})}" data-astryx-theme="{astryx.theme}" data-astryx-mode="{astryx.mode}" data-user-mode="{astryx.allowUserMode}" style="--astryx-layout-content-max-width: {astryx.contentWidth}">
<a class="astryx-skip {ax:recipe(name: 'PageShell', options: {part: 'skip'})}" href="#main-content">{f:translate(key: 'skip', extensionName: 'Typo3Astryx')}</a>
<f:render partial="Header" arguments="{_all}" />
<main class="astryx-main {ax:recipe(name: 'PageShell', options: {part: 'main'})}" id="main-content" tabindex="-1"><f:render section="Main" /></main>
<f:render partial="Footer" arguments="{_all}" />
</div>
