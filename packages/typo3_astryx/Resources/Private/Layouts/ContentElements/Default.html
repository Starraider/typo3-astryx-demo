<f:variable name="astryxOccurrence" value="{ax:occurrence(prefix: 'content', recordUid: data.uid)}" />
<div id="{astryxOccurrence.id}" data-astryx-occurrence="{astryxOccurrence.namespace}" data-astryx-record-anchor="{astryxOccurrence.canonicalId}" data-astryx-record-type="{data.CType}" class="astryx-element {ax:recipe(name: 'PageShell', options: {part: 'element'})} frame-space-before-{f:if(condition: data.space_before_class, then: data.space_before_class, else: 'medium')} frame-space-after-{f:if(condition: data.space_after_class, then: data.space_after_class, else: 'medium')} {ax:recipe(name: 'ContentSpacing', options: {before: data.space_before_class, after: data.space_after_class})}"><f:render section="Main" /></div>
