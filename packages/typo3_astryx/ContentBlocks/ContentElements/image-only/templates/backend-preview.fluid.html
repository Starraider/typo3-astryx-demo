<f:layout name="Preview" />
<f:section name="Header"><strong>{data.header}</strong></f:section>
<f:section name="Content">
    <f:asset.css identifier="astryx-preview" href="EXT:typo3_astryx/Resources/Public/Css/backend-preview.css" />
    <div class="astryx-preview">
        <p><f:translate key="{cb:languagePath()}:preview.columns" default="Columns" />: <f:translate key="{cb:languagePath()}:columns.items.{data.columns}.label" default="3" /> · <f:translate key="{cb:languagePath()}:aspect_ratio.label" default="Image aspect ratio" />: <f:translate key="{cb:languagePath()}:aspect_ratio.items.{data.aspect_ratio}.label" default="Original" /></p>
        <div class="astryx-image-only-preview" data-columns="{data.columns}" data-aspect="{data.aspect_ratio}">
            <f:for each="{data.image}" as="file">
                <f:if condition="{ax:fileAvailable(file: file)}">
                    <figure>
                        <f:image image="{file}" width="240" loading="lazy" decoding="async" />
                        <f:if condition="{file.description}"><figcaption>{file.description}</figcaption></f:if>
                    </figure>
                </f:if>
            </f:for>
        </div>
    </div>
</f:section>
