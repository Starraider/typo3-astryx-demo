name: astryx/text
typeName: astryx_text
group: default
title: Astryx Text
fields:
- identifier: header
  useExistingField: true
- identifier: heading_controls
  type: Palette
  fields:
    - identifier: header_layout
      useExistingField: true
    - identifier: header_position
      useExistingField: true
    - identifier: heading_size
      type: Select
      renderType: selectSingle
      default: medium
      items:
      - value: medium
        label: Medium
      - value: small
        label: Small
      - value: large
        label: Large
      - value: display
        label: Display
- identifier: header_link
  useExistingField: true
- identifier: subheader
  useExistingField: true
- identifier: bodytext
  useExistingField: true
  type: Textarea
  enableRichtext: true
basics:
  - Astryx/spacing
