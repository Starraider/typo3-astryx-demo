<f:layout name="Default" /><f:section name="Main"><section class="astryx-hero" data-layout="{data.layout}" data-variant="{data.variant}" data-align="{data.alignment}"><div><f:if condition="{data.eyebrow}"><astryx:badge text="{data.eyebrow}" /></f:if><f:render partial="ContentElements/Header" arguments="{data: data}" /><astryx:text richText="{data.bodytext}" /><f:render partial="ContentElements/Cta" arguments="{data: data}" /></div><div><f:for each="{data.image}" as="file"><f:render partial="Media/Image" arguments="{file: file, eager: 1, aspectRatio: data.aspect_ratio}" /></f:for></div></section></f:section>
