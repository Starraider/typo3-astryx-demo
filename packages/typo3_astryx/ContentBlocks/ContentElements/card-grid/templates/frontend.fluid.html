<f:layout name="Default" /><f:section name="Main">
    <f:if condition="!{imageSizes}"><f:variable name="imageSizes" value="{ax:imageSizes(profile: 'card-grid', columns: data.columns)}" /></f:if><f:render partial="ContentElements/Header" arguments="{data: data}" /><div class="astryx-card-grid" data-columns="{data.columns}" data-gap="{data.gap}"><f:for each="{data.items}" as="item"><astryx:card title="{item.title}" body="{item.body}" href="{item.link}" label="{item.label}" badge="{item.badge}"><f:fragment name="media"><f:for each="{item.image}" as="file"><f:render partial="Media/Image" arguments="{file: file, aspectRatio: data.aspect_ratio, sizes: imageSizes}" /></f:for></f:fragment></astryx:card></f:for></div></f:section>
