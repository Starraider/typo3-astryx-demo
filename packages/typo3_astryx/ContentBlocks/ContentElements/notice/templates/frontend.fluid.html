<f:layout name="Default" />
<f:section name="Main">
    <aside class="{ax:recipe(name: 'Notice', options: {variant: data.status})}">
        <f:if condition="{data.icon}">
            <f:then>
                <span class="astryx-status">
                    <astryx:icon name="{data.icon}" size="large" />
                    <span>{f:translate(key: 'status.{data.status}', extensionName: 'Typo3Astryx')}</span>
                </span>
            </f:then>
            <f:else>
                <astryx:statusDot label="{f:translate(key: 'status.{data.status}', extensionName: 'Typo3Astryx')}" variant="{data.status}" />
            </f:else>
        </f:if>
        <f:render partial="ContentElements/Header" arguments="{data: data}" />
        <astryx:text richText="{data.bodytext}" width="full" />
        <f:render partial="ContentElements/Cta" arguments="{data: data}" />
    </aside>
</f:section>
