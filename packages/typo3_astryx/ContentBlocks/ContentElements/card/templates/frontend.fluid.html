<f:layout name="Default" /><f:section name="Main">
    <f:if condition="!{imageSizes}"><f:variable name="imageSizes" value="{ax:imageSizes(profile: 'card')}" /></f:if><astryx:card title="{data.header}" body="{data.bodytext}" href="{data.cta_link}" label="{data.cta_label}" secondaryHref="{data.secondary_link}" secondaryLabel="{data.secondary_label}" badge="{data.badge}" variant="{data.variant}" level="2"><f:fragment name="heading"><f:render partial="ContentElements/Header" arguments="{data: data}" /></f:fragment><f:fragment name="media"><f:for each="{data.image}" as="file"><f:render partial="Media/Image" arguments="{file: file, aspectRatio: data.aspect_ratio, sizes: imageSizes}" /></f:for></f:fragment></astryx:card></f:section>
