<f:layout name="Default" /><f:section name="Main"><f:render partial="ContentElements/Header" arguments="{data: data}" /><section data-astryx-carousel data-edge-fade="{data.edge_fade}" aria-label="{data.header}"><f:if condition="{data.navigation}"><div class="astryx-carousel-controls" hidden><button type="button" data-prev aria-controls="carousel{data.uid}" aria-label="{f:translate(key: 'previous', extensionName: 'Typo3Astryx')}"><astryx:icon name="arrow-left" /></button><button type="button" data-next aria-controls="carousel{data.uid}" aria-label="{f:translate(key: 'next', extensionName: 'Typo3Astryx')}"><astryx:icon name="arrow-right" /></button><span data-position role="status" aria-live="polite" aria-atomic="true"></span></div></f:if><ul id="carousel{data.uid}" class="astryx-carousel-track" tabindex="0"><f:for each="{data.items}" as="item"><li><astryx:card title="{item.title}" body="{item.body}" href="{item.link}" label="{item.label}" badge="{item.badge}"><f:fragment name="media"><f:for each="{item.image}" as="file"><f:render partial="Media/Image" arguments="{file: file}" /></f:for></f:fragment></astryx:card></li></f:for></ul></section></f:section>
