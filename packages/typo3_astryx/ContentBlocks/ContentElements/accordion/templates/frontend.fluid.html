<f:layout name="Default" />
<f:section name="Main">
    <f:render partial="ContentElements/Header" arguments="{data: data}" />
    <div class="astryx-accordion" data-astryx-accordion data-mode="{data.mode}">
        <f:variable name="groupName" value="{f:if(condition: '{data.mode} == \'single\'', then: '{astryxOccurrence.namespace}-accordion', else: '')}" />
        <f:for each="{data.items}" as="item" iteration="i">
            <f:if condition="{item.open}">
                <f:then>
                    <details open id="{astryxOccurrence.namespace}-accordion-{i.index}" name="{groupName}">
                        <f:render section="ItemContent" arguments="{item: item, id: '{astryxOccurrence.namespace}-accordion-{i.index}'}" />
                    </details>
                </f:then>
                <f:else>
                    <details id="{astryxOccurrence.namespace}-accordion-{i.index}" name="{groupName}">
                        <f:render section="ItemContent" arguments="{item: item, id: '{astryxOccurrence.namespace}-accordion-{i.index}'}" />
                    </details>
                </f:else>
            </f:if>
        </f:for>
    </div>
</f:section>
<f:section name="ItemContent">
    <summary id="{id}-trigger" aria-controls="{id}-content">
        <span class="astryx-accordion-label">{item.title}</span>
        <span class="astryx-accordion-chevron" aria-hidden="true"></span>
    </summary>
    <div id="{id}-content" class="astryx-accordion-content astryx-prose">
        <f:if condition="{item.body}">{item.body -> f:format.html()}</f:if>
    </div>
</f:section>
