name: astryx/container-two-col
typeName: astryx_container_two_col
group: container
title: Container 2-col 50/50
fields:
- identifier: header
  useExistingField: true
- identifier: heading_controls
  type: Palette
  fields:
    - identifier: header_layout
      useExistingField: true
    - identifier: header_position
      useExistingField: true
    - identifier: heading_size
      type: Select
      renderType: selectSingle
      default: medium
      items:
      - value: medium
        label: Medium
      - value: small
        label: Small
      - value: large
        label: Large
      - value: display
        label: Display
- identifier: header_link
  useExistingField: true
- identifier: subheader
  useExistingField: true
- identifier: ratio
  type: Select
  renderType: selectSingle
  default: 50-50
  items:
  - value: 50-50
    label: 50 50
  - value: 66-33
    label: 66 33
  - value: 33-66
    label: 33 66
- identifier: gap
  type: Select
  renderType: selectSingle
  default: normal
  items:
  - value: normal
    label: Normal
  - value: small
    label: Small
  - value: large
    label: Large
saveAndClose: true
basics:
- Astryx/spacing
