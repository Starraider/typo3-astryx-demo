<f:layout name="Default" />
<f:section name="Main">

    <div class="astryx-grid {ax:recipe(name: 'Grid', options: {columns: 'four', gap: data.gap})}">
        <div><f:if condition="{content.201}">{content.201 -> f:render.contentArea()}</f:if></div>
        <div><f:if condition="{content.202}">{content.202 -> f:render.contentArea()}</f:if></div>
        <div><f:if condition="{content.203}">{content.203 -> f:render.contentArea()}</f:if></div>
        <div><f:if condition="{content.204}">{content.204 -> f:render.contentArea()}</f:if></div>
    </div>
</f:section>
