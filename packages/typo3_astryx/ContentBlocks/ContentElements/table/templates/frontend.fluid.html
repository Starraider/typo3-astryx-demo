<f:layout name="Default" /><f:section name="Main"><f:render partial="ContentElements/Header" arguments="{data: data}" /><div class="astryx-table-scroll astryx-prose"><table><f:if condition="{data.caption}"><caption>{data.caption}</caption></f:if><tbody><f:for each="{data.rows}" as="row" iteration="r"><tr><f:for each="{row.cells}" as="cell"><f:if condition="{data.header_row} && {r.isFirst}"><f:then><th scope="col">{cell.value}</th></f:then><f:else><td>{cell.value}</td></f:else></f:if></f:for></tr></f:for></tbody></table></div></f:section>
