<f:layout name="Default" /><f:section name="Main"><f:render partial="ContentElements/Header" arguments="{data: data}" /><ul><f:for each="{data.media}" as="file"><f:if condition="{ax:fileAvailable(file: file)}"><li><f:link.file file="{file}" download="{true}" filename="{file.name}">{f:if(condition: file.title, then: file.title, else: file.name)}</f:link.file> <span>{file.size -> f:format.bytes()}</span><f:if condition="{file.description}"><p>{file.description}</p></f:if></li></f:if></f:for></ul></f:section>
