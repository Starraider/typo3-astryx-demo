name: astryx/code-block
typeName: astryx_code_block
group: special
title: Code Block
prefixFields: true
prefixType: full
fields:
  - identifier: header
    useExistingField: true
  - identifier: heading_controls
    type: Palette
    fields:
      - identifier: header_layout
        useExistingField: true
      - identifier: header_position
        useExistingField: true
  - identifier: header_link
    useExistingField: true
  - identifier: language
    type: Select
    renderType: selectSingle
    default: javascript
    items:
      - value: javascript
        label: JavaScript
      - value: typescript
        label: TypeScript
      - value: css
        label: CSS
      - value: html
        label: HTML
      - value: php
        label: PHP
      - value: python
        label: Python
      - value: rust
        label: Rust
      - value: bash
        label: Bash
      - value: json
        label: JSON
      - value: yaml
        label: YAML
      - value: plaintext
        label: Plain text
  - identifier: filename
    type: Text
  - identifier: code
    type: Textarea
    rows: 20
    fixedFont: true
    enableTabulator: true
    wrap: off
    enableRichtext: false
  - identifier: line_numbers
    type: Checkbox
    default: 0
basics:
  - Astryx/spacing
